<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Merge Dragons — a browser tribute</title>
<style>
  :root{
    --ink:#2a1b33;
    --panel:rgba(58,38,74,0.82);
    --panel-2:rgba(40,26,54,0.9);
    --edge:rgba(255,231,196,0.22);
    --gold:#f4cf62;
    --gold-2:#b8863a;
    --cream:#fff3e2;
    --green:#8fe07f;
    --pink:#ff7fc0;
    --shadow:0 10px 30px rgba(18,8,28,.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#241a33;
    font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;color:var(--cream)}
  canvas{display:block}
  #game{position:fixed;inset:0;touch-action:none;cursor:grab}
  #game:active{cursor:grabbing}
  #ui{position:fixed;inset:0;pointer-events:none;z-index:10}
  #ui button,#ui .mapnode{pointer-events:auto}

  #boot{position:fixed;inset:0;display:grid;place-items:center;z-index:100;
    background:linear-gradient(160deg,#33254f,#5c4a7a 55%,#c98f77);
    font-size:20px;letter-spacing:.12em;text-transform:uppercase;transition:opacity .5s}
  #boot.gone{opacity:0;pointer-events:none}

  /* ---------- panels ---------- */
  .panel{position:absolute;pointer-events:auto;background:var(--panel);
    border:1px solid var(--edge);border-radius:18px;box-shadow:var(--shadow);
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
  .hidden{display:none !important}

  /* ---------- top bar ---------- */
  .topbar{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:center;
    flex-wrap:wrap;pointer-events:none}
  .chip{display:flex;align-items:center;gap:7px;padding:6px 13px 6px 9px;border-radius:999px;
    background:var(--panel-2);border:1px solid var(--edge);box-shadow:var(--shadow);
    font-weight:700;font-size:14px;letter-spacing:.02em}
  .chip-ico{display:grid;place-items:center;width:20px;height:20px}
  .chip-val{min-width:26px;text-align:right;color:#fff8e8;text-shadow:0 1px 0 rgba(0,0,0,.4)}
  /* a currency at its storage cap: anything more spills onto the board */
  .chip.full{border-color:rgba(255,120,120,.9);box-shadow:0 0 0 1px rgba(255,120,120,.35),var(--shadow)}
  .chip.full .chip-val{color:#ffc0c0}
  .levelname{font-weight:800;font-size:17px;padding:6px 16px;border-radius:999px;
    background:linear-gradient(180deg,rgba(120,86,150,.92),rgba(70,44,96,.92));
    border:1px solid var(--edge);box-shadow:var(--shadow);letter-spacing:.03em}
  .nav{margin-left:auto;display:flex;gap:7px}

  .btn{font:inherit;font-weight:800;font-size:14px;padding:9px 17px;border-radius:999px;cursor:pointer;
    border:1px solid rgba(0,0,0,.28);letter-spacing:.02em;transition:transform .09s,filter .12s;
    color:#3a2410;background:linear-gradient(180deg,#ffe08f,var(--gold));
    box-shadow:0 4px 0 var(--gold-2),0 8px 18px rgba(20,10,30,.4)}
  .btn:hover{filter:brightness(1.07)}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-2)}
  .btn:disabled{opacity:.45;cursor:default;box-shadow:none;transform:none}
  .btn.ghost{color:var(--cream);background:linear-gradient(180deg,rgba(104,74,134,.95),rgba(64,42,90,.95));
    box-shadow:0 4px 0 rgba(30,16,44,.8),0 8px 18px rgba(20,10,30,.35)}
  .btn.ghost.off{opacity:.5}
  .btn.ghost:active{box-shadow:0 1px 0 rgba(30,16,44,.8)}
  .btn.danger{color:#fff0ee;background:linear-gradient(180deg,#e0685f,#a8322f);
    box-shadow:0 4px 0 #6f1f1e,0 8px 18px rgba(20,10,30,.35)}
  .btn.icon{padding:9px 13px}

  /* ---------- quests ---------- */
  .quests{top:62px;right:10px;width:272px;padding:12px 13px 11px;font-size:13px}
  .panel-h{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.72;
    margin:2px 0 7px;display:flex;justify-content:space-between;align-items:center}
  .panel-h .stars{color:var(--gold);letter-spacing:1px;font-size:13px}
  .q{display:flex;gap:8px;align-items:center;margin-bottom:7px}
  .q-tick{width:20px;height:20px;flex:0 0 20px;display:grid;place-items:center;border-radius:6px;
    background:rgba(0,0,0,.3);font-size:12px;color:#cbb8d8}
  .q.done .q-tick{background:linear-gradient(180deg,#7fe07f,#3f9e4f);color:#123;font-weight:900}
  .q.end .q-tick{background:linear-gradient(180deg,#ffd98f,#d09a2f);color:#3a2410}
  .q-main{flex:1;min-width:0}
  .q-label{font-weight:700;font-size:12.5px;line-height:1.25;margin-bottom:3px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .q.done .q-label{opacity:.62;text-decoration:line-through}
  .q-bar{height:5px;border-radius:3px;background:rgba(0,0,0,.34);overflow:hidden}
  .q-bar i{display:block;height:100%;border-radius:3px;
    background:linear-gradient(90deg,#8fe07f,#d9f07f);transition:width .3s}
  .q.end .q-bar i{background:linear-gradient(90deg,#ffd98f,#ff9f5f)}
  .q-num{font-size:11px;opacity:.8;font-variant-numeric:tabular-nums;flex:0 0 auto}
  .q-foot{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.11);
    font-size:11.5px;opacity:.8}

  /* ---------- object information bar ---------- */
  .infobar{bottom:12px;left:12px;display:flex;gap:12px;align-items:center;
    padding:10px 14px;max-width:min(640px,calc(100vw - 24px))}
  .info-thumb{width:62px;height:62px;flex:0 0 62px;border-radius:14px;
    background:radial-gradient(circle at 40% 32%,rgba(255,255,255,.16),rgba(0,0,0,.28));
    border:1px solid var(--edge);display:grid;place-items:center;overflow:hidden}
  .info-body{min-width:0;flex:1}
  .info-name{font-weight:900;font-size:16px;line-height:1.2;letter-spacing:.01em}
  .info-quote{font-size:12px;opacity:.82;font-style:italic;margin:2px 0 3px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .info-meta{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;opacity:.7}
  .info-meta .rar{font-weight:800}
  .info-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .info-actions .btn{font-size:12.5px;padding:8px 13px}

  .hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
    font-size:12.5px;opacity:.62;text-align:center;max-width:56vw;pointer-events:none;
    text-shadow:0 2px 6px rgba(0,0,0,.6)}

  /* ---------- modal ---------- */
  .modal{position:absolute;inset:0;display:grid;place-items:center;pointer-events:auto;z-index:60;
    background:radial-gradient(circle at 50% 40%,rgba(40,22,58,.62),rgba(14,8,22,.86))}
  .modal-box{width:min(560px,92vw);max-height:88vh;overflow:auto;padding:26px 28px 22px;
    border-radius:26px;text-align:center;
    background:linear-gradient(170deg,rgba(86,58,110,.97),rgba(46,28,66,.98));
    border:1px solid rgba(255,225,170,.3);box-shadow:0 26px 70px rgba(8,4,16,.7)}
  .m-kicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.66}
  .m-title{font-size:31px;font-weight:900;margin:4px 0 8px;letter-spacing:.01em;
    background:linear-gradient(180deg,#fff6dd,#f4cf62);-webkit-background-clip:text;
    background-clip:text;color:transparent}
  .m-blurb{font-size:14px;line-height:1.5;opacity:.9;margin-bottom:12px}
  .m-list{text-align:left;font-size:13.5px;line-height:1.55;margin:0 0 14px;padding-left:20px;opacity:.92}
  .m-list li{margin-bottom:6px}
  .m-list b{color:var(--gold)}
  .m-stars{font-size:26px;color:var(--gold);letter-spacing:5px;margin:2px 0 10px}
  .m-stars.big{font-size:44px}
  .m-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 2px;
    border-top:1px solid rgba(255,255,255,.11)}
  .m-row span{opacity:.7}
  .m-quests{font-size:12.5px;text-align:left;opacity:.85;padding:8px 2px;line-height:1.7}
  .m-rewards{margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.11)}
  .m-rewards>span{font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.66}
  .m-rew-list{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
  .m-rew-list canvas{border-radius:11px;background:rgba(0,0,0,.24);
    border:1px solid var(--edge);padding:2px}
  .modal-btns{display:flex;gap:10px;justify-content:center;margin-top:18px}
  .chestwrap{display:grid;place-items:center;margin:4px 0}
  .shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:7px;
    margin:6px 0 4px;text-align:center}
  .shop-head{grid-column:1/-1;text-align:left;font-size:11px;letter-spacing:.18em;
    text-transform:uppercase;opacity:.66;margin-top:8px;padding-bottom:3px;
    border-bottom:1px solid rgba(255,255,255,.13)}
  .shopitem{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;
    border-radius:12px;cursor:pointer;font:inherit;color:var(--cream);
    background:rgba(0,0,0,.24);border:1px solid var(--edge)}
  .shopitem:hover{background:rgba(255,235,190,.14)}
  .shopitem.poor{opacity:.4;cursor:default}
  .si-name{font-size:9.5px;line-height:1.15}
  .si-cost{font-size:10px;font-weight:800;color:var(--gold)}
  .shopitem.poor .si-cost{color:#ff9f9f}
  .bookwrap{max-height:52vh;overflow-y:auto;text-align:left;padding-right:4px}
  .bookrow{margin-bottom:8px}
  .bk-h{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.72;margin-bottom:3px}
  .bk-h b{color:var(--gold);letter-spacing:0}
  .bk-strip{display:flex;flex-wrap:wrap;gap:3px}
  .bk-cell{width:36px;height:36px;border-radius:9px;background:rgba(0,0,0,.26);
    display:grid;place-items:center;overflow:hidden;border:1px solid rgba(255,255,255,.09)}
  .bk-cell.unknown{color:rgba(255,255,255,.28);font-weight:800;font-size:13px}
  .chainstrip{display:flex;gap:2px;align-items:center;overflow-x:auto;padding:10px 2px;
    scrollbar-width:thin}
  .cstep{flex:0 0 auto;width:66px;text-align:center;padding:5px 2px;border-radius:10px}
  .cstep.cur{background:rgba(255,215,120,.18);outline:1px solid rgba(255,215,120,.45)}
  .cstep-n{font-size:9px;line-height:1.2;opacity:.78;margin-top:2px}
  .carrow{opacity:.4;font-size:16px;flex:0 0 auto}

  /* ---------- world map ---------- */
  .screen{position:absolute;inset:0;pointer-events:auto;z-index:30}
  .mapcanvas{position:absolute;inset:0;width:100%;height:100%}
  .mapnodes{position:absolute;inset:0}
  .maptop{position:absolute;top:14px;left:0;right:0;display:flex;flex-direction:column;
    align-items:center;gap:10px;pointer-events:none}
  .maptop .btn{pointer-events:auto}
  .maptitle{font-size:34px;font-weight:900;letter-spacing:.04em;
    background:linear-gradient(180deg,#fff6dd,#f4cf62);-webkit-background-clip:text;
    background-clip:text;color:transparent;text-shadow:0 4px 18px rgba(0,0,0,.5)}
  .mapnode{position:absolute;transform:translate(-50%,-50%);width:104px;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    background:none;border:0;cursor:pointer;color:var(--cream);font:inherit}
  .mapnode .mn-i{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;
    font-weight:900;font-size:16px;color:#3a2410;
    background:linear-gradient(180deg,#ffe89f,var(--gold));
    border:2px solid rgba(255,255,255,.5);
    box-shadow:0 5px 0 var(--gold-2),0 10px 22px rgba(10,6,20,.5);transition:transform .12s}
  .mapnode:hover .mn-i{transform:scale(1.12)}
  .mapnode.done .mn-i{background:linear-gradient(180deg,#b8f0a0,#5fae5f);color:#123}
  .mapnode.locked .mn-i{background:linear-gradient(180deg,#8f8a9a,#57525f);color:#dcd6e4;
    box-shadow:0 4px 0 #35313d}
  .mapnode.locked{cursor:default;opacity:.85}
  .mapnode .mn-name{font-size:11.5px;font-weight:800;text-shadow:0 2px 5px rgba(0,0,0,.75);
    white-space:nowrap}
  .mapnode .mn-stars{font-size:10px;color:var(--gold);letter-spacing:1px;
    text-shadow:0 1px 3px rgba(0,0,0,.8)}

  @media (max-width:820px){
    .quests{width:214px;top:56px;font-size:12px}
    .infobar{max-width:calc(100vw - 24px)}
    .info-actions{flex-direction:column}
    .hint{display:none}
    .maptitle{font-size:24px}
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"></div>
<div id="boot">Waking the dragons&hellip;</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
