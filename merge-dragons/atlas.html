<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sprite atlas — dev tool</title>
<style>
  body{margin:0;background:#5a9440;color:#fff;font:12px/1.3 "Trebuchet MS",system-ui,sans-serif}
  h2{margin:14px 8px 4px;font-size:14px;letter-spacing:.1em;text-transform:uppercase;
     background:rgba(0,0,0,.35);padding:4px 8px;border-radius:6px}
  .row{display:flex;flex-wrap:wrap;gap:2px;padding:0 6px}
  .cell{width:96px;text-align:center;padding:2px;border-radius:8px;background:rgba(0,0,0,.12)}
  .cell.err{background:rgba(255,0,0,.5)}
  .cell div{font-size:9px;opacity:.9;word-break:break-word;line-height:1.15}
  canvas{display:block;margin:0 auto}
  #err{position:fixed;top:0;right:0;background:#900;padding:6px 10px;max-width:40vw;font-size:11px;z-index:9}
</style>
</head>
<body>
<div id="err" style="display:none"></div>
<div id="out"></div>
<script type="module">
import { CHAINS } from './src/registry.js';
import { spriteFor, primeGrowth, T } from './src/sprites.js';
primeGrowth(CHAINS);
const errs = [];
const oldErr = console.error;
console.error = (...a) => { errs.push(a.join(' ')); oldErr(...a); };
const out = document.getElementById('out');
for (const c of Object.values(CHAINS)) {
  const h = document.createElement('h2');
  h.textContent = `${c.label}  (${c.items.length})`;
  out.appendChild(h);
  const row = document.createElement('div');
  row.className = 'row';
  for (const it of c.items) {
    const before = errs.length;
    const sp = spriteFor(it, it.art === 'dragon' ? 'r1' : '');
    const cell = document.createElement('div');
    cell.className = 'cell' + (errs.length > before ? ' err' : '');
    const cv = document.createElement('canvas');
    const S = 88;
    cv.width = S; cv.height = S;
    const ctx = cv.getContext('2d');
    const s = Math.min(S / sp.w, S / sp.h) * 1.5;
    ctx.drawImage(sp.canvas, S / 2 - sp.gx * s, S * 0.95 - sp.gy * s, sp.w * s, sp.h * s);
    cell.appendChild(cv);
    const lab = document.createElement('div');
    lab.textContent = it.name;
    cell.appendChild(lab);
    row.appendChild(cell);
  }
  out.appendChild(row);
}
window.__spriteErrors = errs;
if (errs.length) {
  const e = document.getElementById('err');
  e.style.display = 'block';
  e.textContent = errs.length + ' painter errors: ' + [...new Set(errs)].join(' | ');
}
</script>
</body>
</html>
